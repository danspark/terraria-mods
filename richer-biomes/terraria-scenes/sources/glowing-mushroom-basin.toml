format = 1
name = "Glowing Mushroom basin: giant chamber, dry rim, and spore lake"
seed = 26003
# 120 x 68 cells. The basin spans almost the full scene and has a tall central chimney.
# Two side loops and an elevated dry rim keep the lake from becoming a route lock.
# Eight composed Giant Glowing Mushrooms use exact installed Terraria frames.

[canvas]
size = [120, 68]
scale = 1
boundary = "world"
background = "transparent"
sky = "Background_69"

[palette]
"S" = "stone"
"s" = "stone-wall"
"w" = "water"
"=" = "wood-platform"
"|" = "rope"
"*" = "torch"

[palette."M"]
kind = "tile"
asset = "Tiles_59"
frame_size = 16
stride = 18
autotile = "block"
connect = "solid"
brightness = 1.0

[palette."G"]
kind = "tile"
asset = "Tiles_70"
frame_size = 16
stride = 18
autotile = "block"
connect = "solid"
brightness = 1.0

[palette."m"]
kind = "wall"
asset = "Wall_64"
frame_size = [32, 32]
stride = [36, 36]
autotile = "wall"
connect = "wall"
brightness = 0.58
offset = [-8, -8]

[palette."T"]
kind = "object"
asset = "Tiles_72"
frame_size = [16, 16]
stride = [18, 18]
autotile = "fixed"
frame = [0, 0]
brightness = 1.0

